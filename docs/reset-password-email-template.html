<!--
Supabase → Authentication → Emails → "Reset Password" template (R-E, self-service reset).
Paste the Subject and this HTML into the Message body, on the PROD project (and DEV if testing there).
The {{ .Token }} variable is the numeric OTP code our flow verifies — the default template only
has a link, which the Streamlit console and the tablet cannot complete. Leave {{ .Token }} exactly
as written.

Subject:
  Código para restablecer tu contraseña — Monitoreo Pesquero
-->
<div style="font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#1e1c19;">
  <h2 style="color:#1b5c5a;margin:0 0 4px;">Monitoreo Pesquero</h2>
  <p style="margin:0 0 20px;color:#6b6760;font-size:14px;">Pronatura Noroeste · Restablecer contraseña</p>

  <p style="margin:0 0 12px;">Usa este código para restablecer tu contraseña. Escríbelo en la app (o en la consola) junto con tu nueva contraseña:</p>

  <div style="font-size:34px;font-weight:700;letter-spacing:8px;color:#1b5c5a;background:#e8f3f2;border-radius:6px;padding:18px;text-align:center;margin:0 0 20px;">
    {{ .Token }}
  </div>

  <p style="margin:0;color:#6b6760;font-size:13px;">El código vence en 1 hora. Si no solicitaste este cambio, ignora este correo.</p>
</div>
